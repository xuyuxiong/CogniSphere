<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniSphere - AI 知识库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PrismJS CSS for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              },
              dark: {
                bg: '#0f172a',
                card: '#1e293b',
                text: '#e2e8f0'
              }
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.slate.700'),
                  a: {
                    color: theme('colors.brand.600'),
                    '&:hover': {
                      color: theme('colors.brand.700'),
                    },
                  },
                  'code::before': { content: '""' },
                  'code::after': { content: '""' },
                  'h1': { color: theme('colors.slate.900'), fontWeight: '800' },
                  'h2': { color: theme('colors.slate.800'), fontWeight: '700', marginTop: '1.5em' },
                  'h3': { color: theme('colors.slate.800'), fontWeight: '600' },
                  'blockquote': { borderLeftColor: theme('colors.brand.500'), backgroundColor: theme('colors.brand.50'), padding: '0.5rem 1rem', fontStyle: 'normal' },
                },
              },
              dark: {
                css: {
                  color: theme('colors.slate.300'),
                  strong: { color: theme('colors.white') },
                  h1: { color: theme('colors.white') },
                  h2: { color: theme('colors.white') },
                  h3: { color: theme('colors.white') },
                  h4: { color: theme('colors.white') },
                  a: { color: theme('colors.brand.400') },
                  code: { color: theme('colors.slate.200') },
                  blockquote: { color: theme('colors.slate.300'), borderLeftColor: theme('colors.brand.500'), backgroundColor: theme('colors.brand.900') },
                },
              },
            }),
          }
        },
        plugins: [
          function({ addUtilities }) {
            addUtilities({
              '.prose img': { borderRadius: '0.5rem' },
              '.prose pre': { backgroundColor: '#1e293b', color: '#e2e8f0' },
            })
          }
        ]
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      /* Markdown Styles */
      .markdown-body table { width: 100%; border-collapse: collapse; margin: 1em 0; }
      .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: 6px 12px; }
      .dark .markdown-body th, .dark .markdown-body td { border-color: #475569; }
      .markdown-body tr:nth-child(2n) { background-color: #f8fafc; }
      .dark .markdown-body tr:nth-child(2n) { background-color: #1e293b; }

      /* Editor Styles */
      .editor-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Scroll handled by textarea/pre */
      }
      .editor-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 2rem;
        border: 0;
        box-sizing: border-box;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.875rem; /* text-sm */
        line-height: 1.75; /* leading-7 */
        tab-size: 2;
      }
      .editor-textarea {
        z-index: 1;
        color: transparent;
        background: transparent;
        caret-color: #0ea5e9; /* brand-500 */
        resize: none;
        outline: none;
      }
      .dark .editor-textarea {
        caret-color: #38bdf8; /* brand-400 */
      }
      .editor-highlight {
        z-index: 0;
        pointer-events: none;
      }
      
      /* Syntax Highlighting tweaks for editor */
      .editor-highlight .token.title, 
      .editor-highlight .token.header { font-weight: bold; color: #0284c7; } /* brand-600 */
      .dark .editor-highlight .token.title, 
      .dark .editor-highlight .token.header { color: #38bdf8; }
      
      .editor-highlight .token.list { color: #d97706; } /* amber-600 */
      .dark .editor-highlight .token.list { color: #fbbf24; }
      
      .editor-highlight .token.bold { font-weight: bold; }
      .editor-highlight .token.italic { font-style: italic; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^9.0.1",
    "d3": "https://aistudiocdn.com/d3@^7.9.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "mermaid": "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.esm.min.mjs",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "remark-breaks": "https://esm.sh/remark-breaks@4.0.0"
  }
}
</script>
<!-- Load PrismJS for syntax highlighting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
</head>
  <body class="bg-gray-50 text-slate-900 dark:bg-dark-bg dark:text-dark-text transition-colors duration-200">
    <div id="root"></div>
  </body>
</html>
